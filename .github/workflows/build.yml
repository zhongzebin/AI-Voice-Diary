name: 构建跨平台安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: AI-Voice-Diary-Windows.zip
          - os: macos-13
            name: macOS-Intel
            artifact: AI-Voice-Diary-macOS-Intel.dmg
          - os: macos-14
            name: macOS-AppleSilicon
            artifact: AI-Voice-Diary-macOS-ARM.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.0
          pip install -r backend/requirements.txt

      - name: 打包
        shell: bash
        run: python -m PyInstaller build.spec --noconfirm

      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a -tzip ../AI-Voice-Diary-Windows.zip "AI语音日记"

      - name: 打包 macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/dmg
          cp -r "dist/AI语音日记.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cat > dist/dmg/使用说明.txt << 'EOF'
          安装步骤:

          1. 拖动 AI语音日记.app 到 Applications 文件夹
          2. 首次打开会提示"无法验证开发者"
          3. 进入"系统设置 → 隐私与安全性", 找到该应用, 点击"仍要打开"
          4. 应用会在菜单栏显示图标 (不会出现在 Dock 中)

          权限授权:
          - 首次录音需要授权麦克风权限
          - 保存日记到文档文件夹需要授权访问权限

          故障排查:
          - 如果提示"应用已损坏", 打开终端执行:
            xattr -cr /Applications/AI语音日记.app
          - macOS 11-13 用户右键点击应用, 选择"打开"即可
          EOF
          hdiutil create -volname "AI语音日记" -srcfolder dist/dmg -ov -format UDZO "${{ matrix.artifact }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理文件
        run: |
          mkdir release
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" \) -exec mv {} release/ \;

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## 下载说明

            **Windows 用户**: 下载 `AI-Voice-Diary-Windows.zip`, 解压后运行 `AI语音日记.exe`

            **macOS Intel 用户**: 下载 `AI-Voice-Diary-macOS-Intel.dmg`

            **macOS Apple Silicon 用户 (M1/M2/M3/M4)**: 下载 `AI-Voice-Diary-macOS-ARM.dmg`

            ## macOS 安装步骤

            1. 打开 dmg 文件, 拖动应用到 Applications 文件夹
            2. 打开 Launchpad, 找到 AI语音日记, **右键点击 → 选择"打开"**
            3. 在弹出的警告中点击"打开"按钮
            4. 应用会在菜单栏显示图标

            **macOS Sequoia (15.0+) 用户**:
            - 右键打开可能不再有效
            - 改用: 系统设置 → 隐私与安全性 → 找到该应用 → 点击"仍要打开"

            ## 首次配置

            - DeepSeek API Key: https://platform.deepseek.com/
            - 阿里云百炼 DashScope Key: https://bailian.console.aliyun.com/

            更多说明见项目 README
